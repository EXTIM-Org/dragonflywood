name: dragonflywood

services:
  postgres:
    image: postgres:15-alpine
    container_name: dragonflywood-postgres
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_password
      POSTGRES_DB: ecommerce_db
    ports:
      - "5432:5432"
    volumes:
      - ecommerce_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dragonflywood-redis
    ports:
      - "6379:6379"
    volumes:
      - ecommerce_redisdata:/data
    restart: unless-stopped

volumes:
  ecommerce_pgdata:
    external: true
    name: e-commerce_ecommerce_pgdata
  ecommerce_redisdata:
    external: true
    name: e-commerce_ecommerce_redisdata
